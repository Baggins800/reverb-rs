[package]
name = "reverb-rs"
version = "0.1.0"
edition = "2024"
description = "A drop-in Rust/Tokio replacement for the Laravel Reverb WebSocket server"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.5"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
rand = "0.9"
dashmap = "6"
indexmap = "2"
parking_lot = "0.12"
form_urlencoded = "1"
percent-encoding = "2"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
redis = { version = "0.27", features = ["tokio-comp", "aio", "connection-manager", "tls-rustls", "tokio-rustls-comp"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
