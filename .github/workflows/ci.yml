name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: redis, pcntl
          tools: composer

      # The Laravel and relay suites drive a real PHP process; without this
      # they skip, so build the application they need.
      - name: Build the Laravel test application
        run: ./laravel/tests/setup-test-app.sh "${{ runner.temp }}/reverb-rs-test-app"

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      - name: Test
        env:
          REVERB_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          REVERB_TEST_PHP_APP: ${{ runner.temp }}/reverb-rs-test-app
        run: cargo test --all-targets -- --test-threads=1

      - name: Validate the Composer package
        run: composer validate --no-check-publish --strict

  image:
    name: Build the image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only, to catch a broken Dockerfile before a release needs it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: reverb-rs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image runs and answers
        run: |
          docker run -d --name ci -p 8080:8080 \
            -e REVERB_APP_ID=1 -e REVERB_APP_KEY=k -e REVERB_APP_SECRET=s reverb-rs:ci
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8080/up && break || sleep 1
          done
          curl -sf http://127.0.0.1:8080/up | grep -q '"health":"OK"'
          docker stop -t 15 ci
          test "$(docker inspect -f '{{.State.ExitCode}}' ci)" = "0"
